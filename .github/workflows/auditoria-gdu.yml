name: Auditoria GDU

# Manual: Actions > Auditoria GDU > Run workflow. Solo lee; no escribe en Supabase.
on:
  workflow_dispatch:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comparar fuentes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/auditoria-gdu.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-gdu
          path: auditoria-gdu.csv
