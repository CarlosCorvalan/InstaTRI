name: Clima diario (GDU por campo)

on:
  schedule:
    # GitHub no garantiza el horario exacto de los scheduled workflows
    # gratuitos — pueden demorar. Para tener el dato listo temprano,
    # probamos varias veces entre la 1 y las 6 AM hora Argentina
    # (04:17 a 09:17 UTC). El script es seguro de repetir: si ya cargó
    # el dato del día, lo vuelve a guardar igual sin problema.
    - cron: "17 4 * * *"  # 01:17 ART
    - cron: "17 5 * * *"  # 02:17 ART
    - cron: "17 6 * * *"  # 03:17 ART
    - cron: "17 7 * * *"  # 04:17 ART
    - cron: "17 8 * * *"  # 05:17 ART
    - cron: "17 9 * * *"  # 06:17 ART
  workflow_dispatch: {} # permite tocar "Run workflow" a mano desde la pestaña Actions

jobs:
  actualizar-clima:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calcular y subir GDU diario
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/clima-diario.js
