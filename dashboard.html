<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstaTRI — Escritorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  :root{
    --bg:#F5F8EF; --bg-alt:#EDF3E4; --surface:#FFFFFF; --border:#E1E8D5;
    --text:#1A2317; --text-dim:#647159; --text-faint:#93A186;
    --green:#4C9A3C; --green-dark:#1F3D1A; --green-dark2:#274A20; --green-pale:#B7D3AC;
    --amber:#C77A1F; --amber-bg:#FEF9EE; --amber-border:#E8C98A;
    --red:#A34324; --red-bg:#FDF1EC; --red-border:#E8B3A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Archivo',sans-serif;color:var(--text);height:100%;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;}
  a{text-decoration:none;color:inherit;}
  .hidden{display:none !important;}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 3px 14px rgba(31,61,26,.05);}
  select{font-size:13px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;}

  /* ---------- login ---------- */
  #view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  #login-box{width:340px;display:flex;flex-direction:column;gap:16px;}
  #login-box h1{font-size:22px;font-weight:800;margin:0;}
  .input-wrap{display:flex;flex-direction:column;gap:6px;}
  .input-wrap label{font-size:12px;font-weight:600;color:var(--text-dim);}
  .input-wrap input{border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;}
  .input-wrap input:focus{border-color:var(--green);}
  .btn-primary{background:var(--green);color:#fff;border-radius:12px;padding:13px;font-size:14px;font-weight:700;width:100%;
    transition:transform .15s,box-shadow .15s;}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(76,154,60,.35);}
  #login-error{color:var(--red);font-size:12.5px;display:none;}

  /* ---------- shell ---------- */
  #shell{display:none;min-height:100vh;}
  #shell.on{display:flex;}
  .sidebar{width:76px;flex-shrink:0;background:linear-gradient(180deg,var(--green-dark2),var(--green-dark));
    display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px;position:sticky;top:0;height:100vh;}
  .navbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    transition:background .15s,transform .15s;}
  .navbtn:hover{background:rgba(255,255,255,.1);transform:scale(1.05);}
  .navbtn.active{background:rgba(255,255,255,.16);}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}

  .topbar{padding:24px 32px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .search-box{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 13px;width:260px;}
  .search-box input{border:none;outline:none;background:transparent;font-size:13px;color:var(--text);width:100%;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:0 32px;}
  .kpi{padding:18px;transition:transform .15s;}
  .kpi:hover{transform:translateY(-2px);}
  .kpi .lbl{font-size:12.5px;font-weight:600;}
  .kpi .num{font-size:30px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;}

  .filters{padding:18px 32px 0;display:flex;gap:10px;align-items:center;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:700;padding:0 14px 10px;}
  td{padding:13px 14px;border-top:1px solid #EEF2E7;}
  tr.row-anim{animation:rowIn .35s ease both;}
  @keyframes rowIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.pulse{animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(163,67,36,.35);}50%{box-shadow:0 0 0 6px rgba(163,67,36,0);}}
  .dot.pulse.amber{animation:pulseAmber 1.8s ease-in-out infinite;}
  @keyframes pulseAmber{0%,100%{box-shadow:0 0 0 0 rgba(199,122,31,.35);}50%{box-shadow:0 0 0 6px rgba(199,122,31,0);}}
  tr.clickable{cursor:pointer;transition:background .12s;}
  tr.clickable:hover{background:var(--bg-alt);}

  /* ---------- galeria ---------- */
  .thumb{border-radius:14px;overflow:hidden;position:relative;background:#fff;border:1px solid var(--border);
    box-shadow:0 3px 12px rgba(31,61,26,.05);cursor:pointer;transition:transform .18s,box-shadow .18s;}
  .thumb:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(31,61,26,.14);}
  .thumb-img{width:100%;aspect-ratio:4/3;background-size:cover;background-position:center;transition:transform .3s;background-color:var(--bg-alt);}
  .thumb:hover .thumb-img{transform:scale(1.04);}
  .thumb-cap{padding:9px 11px;}
  .cb{width:19px;height:19px;border-radius:6px;background:rgba(255,255,255,.9);border:1.5px solid #fff;position:absolute;top:9px;left:9px;
    display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
  .cb.checked{background:var(--green);border-color:var(--green);}
  .selbar{position:fixed;left:50%;bottom:24px;transform:translateX(calc(-50% + 38px)) translateY(100px);background:var(--green-dark);
    border-radius:14px;padding:12px 14px 12px 20px;display:flex;align-items:center;gap:18px;box-shadow:0 10px 26px rgba(31,61,26,.3);
    transition:transform .25s ease;z-index:20;}
  .selbar.show{transform:translateX(calc(-50% + 38px)) translateY(0);}

  .view{animation:viewIn .25s ease both;}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .empty{padding:40px;text-align:center;color:var(--text-faint);font-size:13.5px;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="view-login">
  <div id="login-box">
    <div>
      <div class="mono" style="color:var(--text-faint);font-size:12px;">CAMPAÑA 26–27</div>
      <h1>InstaTRI — Escritorio</h1>
    </div>
    <form id="login-form" style="display:flex;flex-direction:column;gap:14px;">
      <div class="input-wrap"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="username" required></div>
      <div class="input-wrap"><label for="login-pass">Contraseña</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
      <div id="login-error"></div>
      <button type="submit" class="btn-primary" id="login-btn">Ingresar</button>
    </form>
  </div>
</div>

<!-- ============ SHELL ============ -->
<div id="shell">
  <div class="sidebar">
    <div style="width:34px;height:34px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;margin-bottom:22px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 20V9M8 13c0-3 4-6 4-6s4 3 4 6"/></svg>
    </div>
    <button class="navbtn" id="nav-dashboard" aria-label="Dashboard de prioridad">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    </button>
    <button class="navbtn" id="nav-galeria" aria-label="Galería">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-11 11"/></svg>
    </button>
  </div>

  <div id="main">

    <!-- ============ DASHBOARD ============ -->
    <div id="view-dashboard" class="view">
      <div class="topbar">
        <div>
          <div class="mono" style="color:var(--text-dim);font-size:12px;">CAMPAÑA 26–27</div>
          <h1 style="margin:2px 0 0;font-size:24px;font-weight:800;">Dashboard de prioridad</h1>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div class="search-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#93A186" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="dash-search" type="text" placeholder="Buscar proyecto…">
          </div>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="card kpi"><div class="lbl" style="color:var(--text-dim);">Proyectos activos</div><div class="num" id="kpi-activos">0</div></div>
        <div class="card kpi" style="border-color:var(--amber-border);background:var(--amber-bg);"><div class="lbl" style="color:#8A6B22;">En ventana hoy</div><div class="num" id="kpi-ventana" style="color:#8A6B22;">0</div></div>
        <div class="card kpi" style="border-color:var(--red-border);background:var(--red-bg);"><div class="lbl" style="color:var(--red);">Fuera de ventana</div><div class="num" id="kpi-fuera" style="color:var(--red);">0</div></div>
        <div class="card kpi"><div class="lbl" style="color:var(--text-dim);">Sin iniciar</div><div class="num" id="kpi-siniciar">0</div></div>
      </div>

      <div class="filters">
        <select id="dash-campo"><option value="">Todos los campos</option></select>
        <select id="dash-grower"><option value="">Todos los growers</option></select>
        <div style="flex:1;"></div>
        <div class="mono" style="color:var(--text-faint);font-size:12.5px;">Ordenado por urgencia</div>
      </div>

      <div style="flex:1;overflow-y:auto;padding:20px 32px 32px;">
        <div class="card" style="overflow:hidden;">
          <table>
            <thead><tr>
              <th style="padding-left:20px;width:16px;"></th>
              <th>Proyecto</th><th>Etapa pendiente</th><th>Campo / Grower</th><th>GDU acum.</th><th>Estado</th>
            </tr></thead>
            <tbody id="dash-tbody"><tr><td colspan="6" class="empty">Cargando…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ============ GALERIA ============ -->
    <div id="view-galeria" class="view hidden">
      <div class="topbar">
        <div>
          <div class="mono" id="gal-count" style="color:var(--text-dim);font-size:12px;">0 FOTOS</div>
          <h1 style="margin:2px 0 0;font-size:24px;font-weight:800;">Galería</h1>
        </div>
        <button id="gal-toggle-select" style="display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span style="font-size:13px;font-weight:600;">Seleccionar</span>
        </button>
      </div>

      <div class="filters" style="padding-bottom:18px;">
        <div class="search-box" style="width:220px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#93A186" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="gal-search" type="text" placeholder="Proyecto…">
        </div>
        <select id="gal-etapa"><option value="">Todas las etapas</option></select>
        <select id="gal-campo"><option value="">Todos los campos</option></select>
        <select id="gal-grower"><option value="">Todos los growers</option></select>
      </div>

      <div style="flex:1;overflow-y:auto;padding:0 32px 32px;">
        <div id="gal-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;"></div>
      </div>

      <div class="selbar" id="gal-selbar">
        <span class="mono" id="gal-selcount" style="color:#fff;font-size:13.5px;font-weight:600;">0 fotos seleccionadas</span>
        <button id="gal-export-btn" style="background:var(--green);color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Exportar a PPT
        </button>
        <button id="gal-selcancel" aria-label="Cancelar selección" style="width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>

<!-- Export modal -->
<div id="export-modal" class="hidden" style="position:fixed;inset:0;background:rgba(20,25,15,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div class="card" style="width:420px;max-width:100%;padding:22px;display:flex;flex-direction:column;gap:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:16px;font-weight:800;">Exportar a PPT</div>
      <button id="export-modal-close" aria-label="Cerrar" style="width:30px;height:30px;border-radius:9px;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="mono" id="export-modal-count" style="color:var(--text-faint);font-size:12px;"></div>

    <div style="display:flex;gap:10px;">
      <button class="export-mode-btn" data-mode="diseno" style="flex:1;text-align:left;border-radius:14px;padding:14px;background:var(--green-dark);border:1.5px solid var(--green-dark);">
        <div style="color:#fff;font-size:14px;font-weight:700;">Con diseño</div>
        <div style="color:var(--green-pale);font-size:11.5px;margin-top:4px;line-height:1.4;">Portada por proyecto + collage de etapas con estilo InstaTRI</div>
      </button>
      <button class="export-mode-btn" data-mode="original" style="flex:1;text-align:left;border-radius:14px;padding:14px;background:#fff;border:1.5px solid var(--border);">
        <div style="color:var(--text);font-size:14px;font-weight:700;">Original</div>
        <div style="color:var(--text-faint);font-size:11.5px;margin-top:4px;line-height:1.4;">Una foto por slide, con proyecto y fecha al pie</div>
      </button>
    </div>

    <button id="export-modal-go" class="btn-primary" style="display:flex;align-items:center;justify-content:center;gap:8px;">
      Generar PPT
    </button>
    <div id="export-modal-status" class="mono" style="color:var(--text-faint);font-size:11.5px;text-align:center;"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="hidden" style="position:fixed;inset:0;background:rgba(20,25,15,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:40px;">
  <button id="lightbox-close" aria-label="Cerrar" style="position:absolute;top:24px;right:28px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div style="max-width:900px;width:100%;display:flex;flex-direction:column;gap:14px;">
    <img id="lightbox-img" style="width:100%;max-height:70vh;object-fit:contain;border-radius:14px;">
    <div class="card" style="padding:16px;">
      <div style="display:flex;align-items:baseline;gap:10px;">
        <span class="mono" id="lightbox-proyecto" style="color:var(--green-dark);font-weight:700;font-size:15px;"></span>
        <span id="lightbox-etapa" style="font-size:14px;font-weight:600;"></span>
        <span class="mono" id="lightbox-fecha" style="color:var(--text-faint);font-size:12.5px;"></span>
      </div>
      <div id="lightbox-nota" style="color:var(--text-dim);font-size:13px;margin-top:6px;"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://aljgksevggwtfndqxoiy.supabase.co";
const SUPABASE_KEY = "sb_publishable_IEGX-ej9_w-tksybzT2Vfw_riE98P7m";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TOLERANCIA_GDU = 20;

let state = {
  proyectos: [], etapas: [], evidencias: [], gduPorProyecto: {},
  selMode: false, selected: new Set(),
};

function $(id){ return document.getElementById(id); }
function fmtDate(d){
  if (!d) return "";
  return new Date(d + "T00:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" });
}

// ---------- animated counter ----------
function animateNumber(el, to){
  const from = 0;
  const dur = 600;
  const t0 = performance.now();
  function tick(t){
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---------- auth ----------
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("login-email").value.trim();
  const pass = $("login-pass").value;
  $("login-error").style.display = "none";
  $("login-btn").disabled = true; $("login-btn").textContent = "Ingresando…";
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  $("login-btn").disabled = false; $("login-btn").textContent = "Ingresar";
  if (error){ $("login-error").textContent = "No pudimos iniciar sesión."; $("login-error").style.display = "block"; return; }
  boot();
});
(async function checkSession(){
  const { data } = await sb.auth.getSession();
  if (data.session) boot();
})();

async function boot(){
  $("view-login").style.display = "none";
  $("shell").classList.add("on");
  await cargarTodo();
  renderDashboard();
  renderGaleria();
}

// ---------- nav ----------
function showView(name){
  $("view-dashboard").classList.toggle("hidden", name !== "dashboard");
  $("view-galeria").classList.toggle("hidden", name !== "galeria");
  $("nav-dashboard").classList.toggle("active", name === "dashboard");
  $("nav-galeria").classList.toggle("active", name === "galeria");
  const v = name === "dashboard" ? $("view-dashboard") : $("view-galeria");
  v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
}
$("nav-dashboard").addEventListener("click", () => showView("dashboard"));
$("nav-galeria").addEventListener("click", () => showView("galeria"));
showView(location.hash === "#galeria" ? "galeria" : "dashboard");

// ---------- data ----------
async function cargarTodo(){
  const [{ data: proyectos }, { data: etapas }, { data: evidencias }, { data: gduRows }] = await Promise.all([
    sb.from("tri_proyectos").select("*, tri_campos(nombre, localidad)").order("proyecto"),
    sb.from("tri_etapas").select("*").order("orden"),
    sb.from("tri_evidencias").select("*"),
    sb.from("tri_gdu_acumulado").select("*"),
  ]);
  state.proyectos = proyectos || [];
  state.etapas = etapas || [];
  state.evidencias = evidencias || [];
  state.gduPorProyecto = {};
  (gduRows || []).forEach(r => { state.gduPorProyecto[r.proyecto_id] = r; });

  // poblar filtros
  const campos = [...new Set(state.proyectos.map(p => p.tri_campos?.nombre).filter(Boolean))].sort();
  const growers = [...new Set(state.proyectos.map(p => p.grower).filter(Boolean))].sort();
  [$("dash-campo"), $("gal-campo")].forEach(sel => {
    campos.forEach(c => sel.insertAdjacentHTML("beforeend", `<option value="${c}">${c}</option>`));
  });
  [$("dash-grower"), $("gal-grower")].forEach(sel => {
    growers.forEach(g => sel.insertAdjacentHTML("beforeend", `<option value="${g}">${g}</option>`));
  });
  state.etapas.forEach(et => $("gal-etapa").insertAdjacentHTML("beforeend", `<option value="${et.id}">${et.nombre}</option>`));
}

function evidenciasDe(proyectoId, etapaNombre){
  const etapa = state.etapas.find(e => e.nombre === etapaNombre);
  if (!etapa) return [];
  return state.evidencias.filter(e => e.proyecto_id === proyectoId && e.etapa_id === etapa.id);
}

function estadoMacho(objetivo, evHembra, evMachoX, gduAcum){
  if (evMachoX) return { nivel: "verde", texto: "✓ " + fmtDate(evMachoX.fecha) };
  if (objetivo == null) return { nivel: "gris", texto: "—" };
  if (!evHembra) return objetivo < 0
    ? { nivel: "gris", texto: "pendiente (va antes)" }
    : { nivel: "gris", texto: "sin iniciar" };
  if (objetivo < 0) return { nivel: "rojo", texto: "orden invertido" };
  if (gduAcum == null) return { nivel: "gris", texto: "pendiente" };
  if (gduAcum > objetivo + TOLERANCIA_GDU) return { nivel: "rojo", texto: `fuera de ventana · +${Math.round(gduAcum - objetivo)} GDU` };
  if (gduAcum >= objetivo) return { nivel: "ambar", texto: "en ventana hoy" };
  return { nivel: "gris", texto: `en curso · ${Math.round(gduAcum)}/${objetivo}` };
}

function estadoProyecto(p){
  const gduRow = state.gduPorProyecto[p.id];
  const evsHembra = evidenciasDe(p.id, "Siembra Hembra");
  const evsM1 = evidenciasDe(p.id, "Siembra Macho 1");
  const evsM2 = evidenciasDe(p.id, "Siembra Macho 2");
  const evHembra = evsHembra[0], evM1 = evsM1[0], evM2 = evsM2[0];
  const gduAcum = gduRow ? Number(gduRow.gdu_acumulado) : null;

  if (!evHembra) return { nivel: "gris", label: "Sin iniciar", etapaPendiente: "Siembra hembra", gduTexto: "—" };
  if (evM1 && evM2) return { nivel: "verde", label: "Al día", etapaPendiente: "—", gduTexto: gduAcum != null ? Math.round(gduAcum) : "—" };

  const e1 = estadoMacho(p.macho1_gdu_objetivo, evHembra, evM1, gduAcum);
  const e2 = estadoMacho(p.macho2_gdu_objetivo, evHembra, evM2, gduAcum);
  const orden = { rojo: 0, ambar: 1, gris: 2, verde: 3 };
  const peor = orden[e1.nivel] <= orden[e2.nivel] ? e1 : e2;
  const etapaPendiente = !evM1 ? "Siembra macho 1" : "Siembra macho 2";
  return { nivel: peor.nivel, label: peor.texto, etapaPendiente, gduTexto: gduAcum != null ? Math.round(gduAcum) : "—" };
}

// ---------- dashboard ----------
function renderDashboard(){
  const q = $("dash-search").value.trim().toLowerCase();
  const campoF = $("dash-campo").value;
  const growerF = $("dash-grower").value;

  let filas = state.proyectos.map(p => ({ p, est: estadoProyecto(p) }));
  if (q) filas = filas.filter(({p}) => [p.proyecto, p.genotype, p.grower].filter(Boolean).some(v => v.toLowerCase().includes(q)));
  if (campoF) filas = filas.filter(({p}) => p.tri_campos?.nombre === campoF);
  if (growerF) filas = filas.filter(({p}) => p.grower === growerF);

  const orden = { rojo: 0, ambar: 1, gris: 2, verde: 3 };
  filas.sort((a, b) => orden[a.est.nivel] - orden[b.est.nivel]);

  const colores = {
    rojo: { dot: "#A34324", texto: "var(--red)", bg: "" },
    ambar: { dot: "#C77A1F", texto: "#8A6B22", bg: "" },
    gris: { dot: "#B9C2A9", texto: "var(--text-dim)", bg: "" },
    verde: { dot: "#4C9A3C", texto: "#2E6A24", bg: "" },
  };

  const tbody = $("dash-tbody");
  if (filas.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" class="empty">Sin resultados.</td></tr>`;
  } else {
    tbody.innerHTML = filas.map(({p, est}, i) => {
      const c = colores[est.nivel];
      const campoNombre = p.tri_campos?.nombre || "";
      const pulseClass = est.nivel === "rojo" ? "pulse" : est.nivel === "ambar" ? "pulse amber" : "";
      return `
        <tr class="row-anim clickable" data-proyecto="${p.proyecto}" style="animation-delay:${Math.min(i,12)*25}ms;">
          <td style="padding-left:20px;"><div class="dot ${pulseClass}" style="background:${c.dot};"></div></td>
          <td><span class="mono" style="color:var(--text);font-weight:700;font-size:13px;">${p.proyecto}</span><div class="mono" style="color:var(--text-faint);font-size:10.5px;">${p.genotype || ""}</div></td>
          <td style="font-size:13px;">${est.etapaPendiente}</td>
          <td style="color:var(--text-dim);font-size:13px;">${campoNombre}${campoNombre && p.grower ? " · " : ""}${p.grower || ""}</td>
          <td class="mono" style="font-size:12.5px;">${est.gduTexto}</td>
          <td><span style="color:${c.texto};font-size:12.5px;font-weight:700;">${est.label}</span></td>
        </tr>`;
    }).join("");
    tbody.querySelectorAll("tr[data-proyecto]").forEach(tr => {
      tr.addEventListener("click", () => {
        window.location.href = `index.html#detalle/${tr.getAttribute("data-proyecto")}`;
      });
    });
  }

  const activos = filas.filter(({est}) => est.nivel !== "verde" && est.etapaPendiente !== "Siembra hembra").length;
  animateNumber($("kpi-activos"), state.proyectos.length);
  animateNumber($("kpi-ventana"), filas.filter(({est}) => est.nivel === "ambar").length);
  animateNumber($("kpi-fuera"), filas.filter(({est}) => est.nivel === "rojo").length);
  animateNumber($("kpi-siniciar"), filas.filter(({est}) => est.etapaPendiente === "Siembra hembra").length);
}
["dash-search","dash-campo","dash-grower"].forEach(id => $(id).addEventListener("input", renderDashboard));

// ---------- galeria ----------
function renderGaleria(){
  const q = $("gal-search").value.trim().toLowerCase();
  const etapaF = $("gal-etapa").value;
  const campoF = $("gal-campo").value;
  const growerF = $("gal-grower").value;

  const proyectoPorId = {}; state.proyectos.forEach(p => proyectoPorId[p.id] = p);
  const etapaPorId = {}; state.etapas.forEach(e => etapaPorId[e.id] = e);

  let fotos = state.evidencias.filter(e => e.foto_url);
  fotos = fotos.filter(e => {
    const p = proyectoPorId[e.proyecto_id];
    if (!p) return false;
    if (q && !p.proyecto.toLowerCase().includes(q)) return false;
    if (etapaF && e.etapa_id !== etapaF) return false;
    if (campoF && p.tri_campos?.nombre !== campoF) return false;
    if (growerF && p.grower !== growerF) return false;
    return true;
  });
  fotos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

  $("gal-count").textContent = `${fotos.length} FOTO${fotos.length === 1 ? "" : "S"}`;

  const grid = $("gal-grid");
  if (fotos.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">Todavía no hay fotos que coincidan con el filtro.</div>`;
    return;
  }
  grid.innerHTML = fotos.map((ev, i) => {
    const p = proyectoPorId[ev.proyecto_id];
    const et = etapaPorId[ev.etapa_id];
    const checked = state.selected.has(ev.id);
    return `
      <div class="thumb" data-id="${ev.id}" style="animation:viewIn .25s ease both;animation-delay:${Math.min(i,20)*20}ms;">
        <div class="thumb-img" style="background-image:url('${ev.foto_url}');"></div>
        <div class="cb ${checked ? "checked" : ""} ${state.selMode ? "" : "hidden"}">
          ${checked ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : ""}
        </div>
        <div class="thumb-cap">
          <div class="mono" style="color:var(--text);font-size:11px;font-weight:700;">${p ? p.proyecto : ""}</div>
          <div style="color:var(--text-dim);font-size:10.5px;">${et ? et.nombre : ""} · ${fmtDate(ev.fecha)}</div>
        </div>
      </div>`;
  }).join("");

  grid.querySelectorAll(".thumb").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-id");
      if (state.selMode){
        if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
        renderGaleria();
        updateSelbar();
      } else {
        abrirLightbox(id, proyectoPorId, etapaPorId);
      }
    });
  });
}
["gal-search","gal-etapa","gal-campo","gal-grower"].forEach(id => $(id).addEventListener("input", renderGaleria));

$("gal-toggle-select").addEventListener("click", () => {
  state.selMode = !state.selMode;
  if (!state.selMode) state.selected.clear();
  renderGaleria();
  updateSelbar();
});
$("gal-selcancel").addEventListener("click", () => {

function updateSelbar(){
  $("gal-selbar").classList.toggle("show", state.selMode && state.selected.size > 0);
  $("gal-selcount").textContent = `${state.selected.size} foto${state.selected.size === 1 ? "" : "s"} seleccionada${state.selected.size === 1 ? "" : "s"}`;

const PPT = {
  GREEN_DARK: "1F3D1A", GREEN_DARK2: "274A20", GREEN: "4C9A3C",
  GREEN_LIGHT: "9CC98A", GREEN_PALE: "B7D3AC", BG: "F5F8EF",

async function fotoABase64(url){
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function medirImagen(dataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Encaja una imagen dentro de una caja (boxX,boxY,boxW,boxH) SIN deformarla —
// la escala al máximo que entra completa y la centra (como object-fit: contain).
function encajarSinDeformar(dims, boxX, boxY, boxW, boxH){
  const imgRatio = dims.w / dims.h;
  const boxRatio = boxW / boxH;
  let w, h;
  if (imgRatio > boxRatio){ w = boxW; h = boxW / imgRatio; }
  else { h = boxH; w = boxH * imgRatio; }
  const x = boxX + (boxW - w) / 2;
  const y = boxY + (boxH - h) / 2;
  return { x, y, w, h };
}

$("export-modal-go").addEventListener("click", async () => {
  const ids = [...state.selected];
  if (ids.length === 0){ $("export-modal-status").textContent = "Elegí al menos una foto en la galería."; return; }

  const btn = $("export-modal-go");
  btn.disabled = true;
  const statusEl = $("export-modal-status");

  try {
    const proyectoPorId = {}; state.proyectos.forEach(p => proyectoPorId[p.id] = p);
    const etapaPorId = {}; state.etapas.forEach(e => etapaPorId[e.id] = e);
    const evidencias = ids.map(id => state.evidencias.find(e => e.id === id)).filter(Boolean);

    statusEl.textContent = `Descargando ${evidencias.length} foto(s)…`;
    const conBase64 = [];
    for (let i = 0; i < evidencias.length; i++){
      const ev = evidencias[i];
      btn.textContent = `Preparando ${i + 1}/${evidencias.length}…`;
      const data = await fotoABase64(ev.foto_url);
      const dims = await medirImagen(data);
      conBase64.push({ ev, data, dims });
    }

    statusEl.textContent = "Armando el PPT…";
    btn.textContent = "Generando…";

    const pres = new PptxGenJS();
    pres.layout = "LAYOUT_WIDE";
    const W = 13.33, H = 7.5;

    if (exportMode === "diseno") {
      const porProyecto = {};
      conBase64.forEach(item => {
        const pid = item.ev.proyecto_id;
        (porProyecto[pid] = porProyecto[pid] || []).push(item);
      });

      Object.keys(porProyecto).forEach(pid => {
        const p = proyectoPorId[pid];
        const items = porProyecto[pid];
        if (!p) return;

        // portada
        let s = pres.addSlide();
        s.background = { color: PPT.GREEN_DARK };
        s.addShape("rect", { x: 9.4, y: 0, w: W - 9.4, h: H, fill: { color: "2E6A24" } });
        s.addText(`CAMPAÑA 26–27  ·  STAGE ${p.stage || ""}`, { x: 0.7, y: 0.6, w: 8, h: 0.4, fontFace: "Calibri", fontSize: 12, color: PPT.GREEN_LIGHT, isTextBox: true, margin: 0 });
        s.addText(p.proyecto, { x: 0.7, y: 1.0, w: 8, h: 1.0, fontFace: "Cambria", fontSize: 40, bold: true, color: "FFFFFF", isTextBox: true, margin: 0 });
        s.addText(p.genotype || "", { x: 0.7, y: 1.85, w: 8, h: 0.4, fontFace: "Courier New", fontSize: 14, color: PPT.GREEN_PALE, isTextBox: true, margin: 0 });

        const campoNombre = p.tri_campos ? p.tri_campos.nombre : "";
        const fields = [
          ["FEMALE", p.female || "—"], ["MALE", p.male || "—"],
          ["CAMPO", campoNombre || "—"], ["GROWER", p.grower || "—"],
          ["VENTANA", p.ventana_sugerida || "—"], ["GDU OBJETIVO", p.gdu_objetivo != null ? String(p.gdu_objetivo) : "—"],
        ];
        let fx = 0.7, fy = 2.7;
        fields.forEach((f, i) => {
          const col = i % 3, row = Math.floor(i / 3);
          const x = fx + col * 2.75, y = fy + row * 1.05;
          s.addText(f[0], { x, y, w: 2.6, h: 0.3, fontFace: "Calibri", fontSize: 10, color: "7FA872", isTextBox: true, margin: 0 });
          s.addText(f[1], { x, y: y + 0.3, w: 2.6, h: 0.4, fontFace: "Courier New", fontSize: 14, color: "EAF1E3", isTextBox: true, margin: 0 });
        });

        // collage — 3 por slide
        const cardW = 3.85, cardH = 4.6, gap = 0.35, cx0 = 0.6, cy0 = 1.5;
        for (let start = 0; start < items.length; start += 3){
          const grupo = items.slice(start, start + 3);
          let s2 = pres.addSlide();
          s2.background = { color: PPT.BG };
          s2.addText(`${p.proyecto}  ·  Evidencias`, { x: 0.6, y: 0.4, w: 10, h: 0.5, fontFace: "Cambria", fontSize: 22, bold: true, color: PPT.TEXT, isTextBox: true, margin: 0 });
          s2.addText(`${p.genotype || ""}  ·  ${campoNombre}${campoNombre && p.grower ? " · " : ""}${p.grower || ""}`, { x: 0.6, y: 0.85, w: 10, h: 0.35, fontFace: "Courier New", fontSize: 11, color: PPT.TEXT_DIM, isTextBox: true, margin: 0 });

          grupo.forEach((item, i) => {
            const x = cx0 + i * (cardW + gap);
            const et = etapaPorId[item.ev.etapa_id];
            s2.addShape("roundRect", { x, y: cy0, w: cardW, h: cardH, fill: { color: PPT.CARD }, line: { color: PPT.BORDER, width: 1 }, rectRadius: 0.12 });
            const boxImg = { x: x + 0.2, y: cy0 + 0.2, w: cardW - 0.4, h: cardH - 1.5 };
            s2.addShape("rect", { ...boxImg, fill: { color: "EDF3E4" } }); // relleno neutro por si la foto no llena toda la caja (vertical vs. horizontal)
            const fit = encajarSinDeformar(item.dims, boxImg.x, boxImg.y, boxImg.w, boxImg.h);
            s2.addImage({ data: item.data, x: fit.x, y: fit.y, w: fit.w, h: fit.h });
            s2.addText(et ? et.nombre : "", { x: x + 0.2, y: cy0 + cardH - 1.15, w: cardW - 0.4, h: 0.35, fontFace: "Calibri", bold: true, fontSize: 13, color: PPT.TEXT, isTextBox: true, margin: 0 });
            s2.addText(fmtDate(item.ev.fecha), { x: x + 0.2, y: cy0 + cardH - 0.82, w: cardW - 0.4, h: 0.3, fontFace: "Courier New", fontSize: 10, color: "2E6A24", isTextBox: true, margin: 0 });
            if (item.ev.nota){
              s2.addText(item.ev.nota, { x: x + 0.2, y: cy0 + cardH - 0.52, w: cardW - 0.4, h: 0.4, fontFace: "Calibri", fontSize: 8.5, color: PPT.TEXT_DIM, isTextBox: true, margin: 0 });
            }
          });
        }
      });
    } else {
      // modo original: una foto por slide
      conBase64.forEach(item => {
        const p = proyectoPorId[item.ev.proyecto_id];
        let s = pres.addSlide();
        s.background = { color: "111411" };
        const fit = encajarSinDeformar(item.dims, 0, 0.15, W, H - 0.55 - 0.3);
        s.addImage({ data: item.data, x: fit.x, y: fit.y, w: fit.w, h: fit.h });
        s.addShape("rect", { x: 0, y: H - 0.55, w: W, h: 0.55, fill: { color: "000000", transparency: 35 } });
        s.addText(p ? p.proyecto : "", { x: 0.35, y: H - 0.48, w: 4, h: 0.4, fontFace: "Courier New", fontSize: 14, bold: true, color: "FFFFFF", isTextBox: true, margin: 0 });
        s.addText(fmtDate(item.ev.fecha), { x: W - 3, y: H - 0.48, w: 2.65, h: 0.4, fontFace: "Courier New", fontSize: 14, color: "FFFFFF", align: "right", isTextBox: true, margin: 0 });
      });
    }

    const nombreArchivo = `InstaTRI_${exportMode === "diseno" ? "diseno" : "original"}_${new Date().toISOString().slice(0,10)}.pptx`;
    await pres.writeFile({ fileName: nombreArchivo });

    statusEl.textContent = "Listo — descargado.";
    setTimeout(() => { $("export-modal").classList.add("hidden"); }, 900);
  } catch (e) {
    statusEl.textContent = "No se pudo generar el PPT: " + (e && e.message ? e.message : e);
  } finally {
    btn.disabled = false;
    btn.textContent = "Generar PPT";
  }
});
