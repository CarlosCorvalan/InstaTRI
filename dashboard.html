<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstaTRI — Escritorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#F5F8EF; --bg-alt:#EDF3E4; --surface:#FFFFFF; --border:#E1E8D5;
    --text:#1A2317; --text-dim:#647159; --text-faint:#93A186;
    --green:#4C9A3C; --green-dark:#1F3D1A; --green-dark2:#274A20; --green-pale:#B7D3AC;
    --amber:#C77A1F; --amber-bg:#FEF9EE; --amber-border:#E8C98A;
    --red:#A34324; --red-bg:#FDF1EC; --red-border:#E8B3A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Manrope',system-ui,sans-serif;color:var(--text);height:100%;}
  .mono{font-family:'Manrope',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;}
  a{text-decoration:none;color:inherit;}
  .hidden{display:none !important;}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 3px 14px rgba(31,61,26,.05);}
  select{font-size:15px;font-weight:600;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 14px;}

  /* ---------- login ---------- */
  #view-login{min-height:100vh;display:flex;align-items:center;justify-content:center;}
